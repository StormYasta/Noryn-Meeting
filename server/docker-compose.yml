services:
  meeting-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: noryn-meeting-ai
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Intentional: backend is reachable only from the VPS itself.
      # Desktop clients use SSH local port forwarding.
      - "127.0.0.1:${MEETING_PORT:-8765}:8765"
    volumes:
      - ./data:/data
      - ./model-cache:/root/.cache/huggingface
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8765/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    # If the VPS Docker runtime already has NVIDIA Container Toolkit, uncomment:
    # gpus: all
