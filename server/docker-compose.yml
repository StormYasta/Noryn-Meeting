services:
  meeting-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: noryn-meeting-ai
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:${MEETING_PORT:-8765}:8765"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
